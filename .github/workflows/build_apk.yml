name: Build Android APK and Web Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendX-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Split APKs (arm64-v8a, armeabi-v7a, x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: AttendX-Android-Split-APKs
          path: build/app/outputs/flutter-apk/app-*.apk

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendX-Web-Build
          path: build/web
