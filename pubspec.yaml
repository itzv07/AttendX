name: attendx
description: AttendX — Smart College Attendance Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  pinput: ^5.0.0

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.20.0
  uuid: ^4.5.1
  crypto: ^3.0.5
  url_launcher: ^6.3.0
  share_plus: ^10.1.1
  path_provider: ^2.1.4
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.1

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # Forms & Validation
  reactive_forms: any

  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Connectivity
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
